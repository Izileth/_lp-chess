<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo escuro -->
  <rect width="100%" height="100%" fill="#000000" />
  
  <!-- Grupo contendo as formas geométricas do logo -->
  <g fill="#FFFFFF" transform="translate(256, 271) scale(1.75) translate(-256, -271)">
    
    <!-- Diamante Superior -->
    <path d="M 256 136 L 272 146 L 256 156 L 240 146 Z" />
    
    <!-- Pilar Central (Forma de ampulheta) -->
    <path d="M 256 170 
             L 216 195 
             C 250 225, 250 287, 216 317 
             L 256 342 
             L 296 317 
             C 262 287, 262 225, 296 195 Z" />
             
    <!-- Forma Lateral Esquerda (Acompanha a curva central mantendo espessura e gap uniformes) -->
    <path d="M 170 170 
             L 200 195 
             C 234 225, 234 287, 200 317 
             L 170 342 
             L 140 317 
             C 174 287, 174 225, 140 195 Z" />
             
    <!-- Forma Lateral Direita (Espelhada) -->
    <path d="M 342 170 
             L 312 195 
             C 278 225, 278 287, 312 317 
             L 342 342 
             L 372 317 
             C 338 287, 338 225, 372 195 Z" />
             
    <!-- Diamante Inferior Menor (Centro) -->
    <path d="M 256 352 L 276 362 L 256 372 L 236 362 Z" />
    
    <!-- Diamante Inferior Largo (Base) -->
    <path d="M 256 382 L 306 394 L 256 406 L 206 394 Z" />
    
  </g>
</svg>